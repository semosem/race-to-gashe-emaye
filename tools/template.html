<title>Race to Gashe &amp; Emaye's</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--FONTS-->
<style>
/* Layout: full-screen canvas game; HTML overlays (title, team, dialogs) in coffee-brown panels with gold rims and a woven tibeb band. Single committed dark look. */
:root{
  color-scheme: dark;
  --coffee:#1e0f08;
  --panel:rgba(30,15,8,.94);
  --panel2:#2c170d;
  --gold:#f2b632;
  --gold2:#ffd77a;
  --cream:#fbf3e2;
  --muted:#e2c9a6;
  --green:#2f8f4e;
  --red:#d2433a;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  --geez:"Noto Sans Ethiopic","Nyala","Abyssinica SIL",sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--coffee);color:var(--cream);font-family:var(--body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));box-sizing:border-box}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#c{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;padding:14px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow-y:auto;background:rgba(20,8,4,.35)}
.overlay[hidden]{display:none}
.card{position:relative;background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:26px 22px 20px;width:100%;max-width:560px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:url(assets/tibeb.webp) repeat-x;background-size:auto 12px}
.card.wide{max-width:860px}
.geez{font-family:var(--geez);color:var(--gold);margin:0;letter-spacing:.03em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,5.4vw,3rem);line-height:1;margin:0;color:var(--gold2);text-wrap:balance;text-shadow:0 3px 0 #6b3a12}
h2{font-family:var(--display);font-weight:400;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0}
p{margin:0;color:var(--muted);line-height:1.5}
button{font-family:var(--display);font-size:1.2rem;color:#2a1405;background:linear-gradient(#ffd77a,#f2b632);border:0;border-radius:11px;padding:11px 20px;cursor:pointer;box-shadow:0 4px 0 #9c6a14}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #9c6a14}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
button.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--muted);font-size:1rem}
button.small{font-size:.85rem;padding:7px 10px;box-shadow:0 3px 0 #9c6a14}
button.small.ghost{box-shadow:inset 0 0 0 1.5px var(--muted)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#lineup{width:100%;height:clamp(150px,34vh,260px);display:block}
/* Title: no panel, logo over the sky, runners on the path, buttons below */
#titleScreen{background:linear-gradient(rgba(20,8,4,.55),rgba(20,8,4,.05) 38%,rgba(20,8,4,.05) 62%,rgba(20,8,4,.6));align-items:stretch}
.title-stage{justify-content:space-between;align-items:center;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:clamp(4px,3vh,28px)}
.logo .geez{font-size:clamp(1rem,2.6vw,1.4rem);color:var(--gold);text-shadow:0 2px 0 #2a1405,0 0 12px rgba(0,0,0,.5)}
.logo h1{font-size:clamp(2.1rem,7vw,4.6rem);line-height:.95;color:var(--gold2);
  text-shadow:0 4px 0 #6b3a12,3px 3px 0 #2a1405,-3px 3px 0 #2a1405,3px -2px 0 #2a1405,-3px -2px 0 #2a1405,0 10px 26px rgba(0,0,0,.55)}
.logo h1 span{display:block}
.logo .tag{color:var(--cream);font-size:clamp(.9rem,2vw,1.1rem);text-shadow:1px 1px 0 #2a1405,-1px 1px 0 #2a1405,0 2px 8px rgba(0,0,0,.7)}
.logo .tag .geez{font-size:1em;color:var(--gold2)}
#titleScreen #lineup{margin-top:auto}
.menu{display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:6px;width:100%}
#quickBtn{font-size:1.45rem;padding:13px 40px;min-width:260px}
.menu .ghost{background:rgba(30,15,8,.72)}
/* Family tree */
#treeScreen{background:linear-gradient(rgba(20,8,4,.7),rgba(20,8,4,.45));align-items:stretch}
.hint{font-size:.85rem}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.lvl[aria-pressed="true"]{background:linear-gradient(#ffd77a,#f2b632);color:#2a1405;box-shadow:0 3px 0 #9c6a14}
.lvl{font-family:var(--display)}
.lvl .geez{color:inherit;font-size:1.05rem}
.mate.on{box-shadow:inset 0 0 0 2px var(--gold)}
.mate{background:var(--panel2);border-radius:12px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.mate canvas{width:120px;height:140px}
.mate b{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--cream)}
.mate .age{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mate .pw{font-size:.82rem;color:var(--gold2);line-height:1.3}
.mate .pw b{font-family:var(--body);font-weight:800;font-size:.85rem;color:var(--gold2)}
.mate .row{gap:6px;margin-top:4px}
.fam{font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-weight:400;font-size:1.7rem;color:var(--cream)}
.stats span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fidel{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.fidel small{display:block;font-family:var(--body);font-size:.7rem;margin-top:4px;opacity:.85}
.fidel span{font-family:var(--geez);font-size:1.7rem;line-height:1;padding:9px 0 6px;border-radius:8px;background:rgba(251,243,226,.06);color:rgba(251,243,226,.3)}
.fidel span.got{background:linear-gradient(#ffd77a,#f2b632);color:#3a1d06}
.say{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel2);border-radius:12px;padding:8px 12px}
.say img{height:84px;width:auto;flex:none}
.say p{color:var(--cream)}
#pauseBtn{position:absolute;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;padding:0;font-size:1.1rem;border-radius:50%;background:rgba(30,15,8,.7);color:var(--gold2);box-shadow:inset 0 0 0 2px var(--gold)}
#cropBox{position:relative;width:240px;height:240px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000;touch-action:none;cursor:grab}
#cropBox canvas{width:240px;height:240px;display:block}
#cropBox::after{content:"";position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle at 50% 50%,transparent 0 84px,rgba(0,0,0,.6) 85px);pointer-events:none}
input[type=range]{width:100%;accent-color:var(--gold)}
.pause-say{margin:-4px 0 14px;color:var(--cream);font-size:1.05rem}
.tl,.tr{display:flex;flex-direction:column;gap:12px;min-width:0}
#wrap{-webkit-touch-callout:none}
button{min-height:44px}
button.small{min-height:36px}
#rotate{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(20,8,4,.92);z-index:5;text-align:center;padding:24px}
#rotate p{font-family:var(--display);font-size:1.4rem;color:var(--gold2);max-width:16em}
#rotate .phone{width:46px;height:80px;border:4px solid var(--gold2);border-radius:10px;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
body.rot #rotate{display:flex}
@media (prefers-reduced-motion:reduce){#rotate .phone{animation:none;transform:rotate(-90deg)}}
/* Runner select: no panel, everything sits on the scenery */
#teamScreen{background:linear-gradient(rgba(20,8,4,.62),rgba(20,8,4,.12) 32%,rgba(20,8,4,.05) 60%,rgba(20,8,4,.55));align-items:stretch}
.stage{width:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:100%}
.stage-top{display:grid;grid-template-columns:44px 1fr 44px;grid-template-areas:"back title ." "lv lv lv";align-items:center;row-gap:10px}
.stage-top h1{grid-area:title;text-align:center;font-size:clamp(1.6rem,4.4vw,2.6rem);color:var(--gold2);
  text-shadow:0 3px 0 #6b3a12,0 0 2px #2a1405,2px 2px 0 #2a1405,-2px 2px 0 #2a1405,2px -1px 0 #2a1405,-2px -1px 0 #2a1405,0 6px 18px rgba(0,0,0,.55)}
.stage-top .row{grid-area:lv}
.back{grid-area:back;width:44px;height:44px;padding:0;border-radius:50%;font-size:1.8rem;line-height:1;background:rgba(30,15,8,.7);color:var(--gold2);box-shadow:inset 0 0 0 2px var(--gold)}
.back:active{transform:translateY(1px);box-shadow:inset 0 0 0 2px var(--gold)}
.lvl{background:rgba(30,15,8,.7)!important;color:var(--cream)!important;box-shadow:inset 0 0 0 2px rgba(242,182,50,.55)!important}
.lvl[aria-pressed="true"]{background:linear-gradient(#ffd77a,#f2b632)!important;color:#2a1405!important;box-shadow:0 3px 0 #9c6a14!important}
#teamScreen .team{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:4px 6px;align-items:end}
#teamScreen .mate{background:none;box-shadow:none;padding:4px 2px 6px;gap:2px;position:relative;border-radius:14px;display:flex;flex-direction:column;align-items:center;
  font:inherit;color:inherit;cursor:pointer;min-height:0}
#teamScreen .mate:active{transform:none;box-shadow:none}
#teamScreen .mate,#teamScreen .mate canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-x}
#teamScreen .mate:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
#teamScreen .mate.on b{color:var(--gold2)}
#teamScreen .mate.on .pw b{color:var(--cream)}
#teamScreen .team{margin-top:auto}
#teamScreen .team.more-r{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
#teamScreen .team.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%);mask-image:linear-gradient(90deg,transparent,#000 12%)}
#teamScreen .team.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.go{display:flex;justify-content:center;padding-bottom:4px}
#teamScreen .mate.on::before{opacity:1;box-shadow:0 0 18px 6px rgba(255,215,122,.35)}
#goBtn{font-size:1.35rem;padding:12px 34px;min-width:240px}
#teamScreen .mate canvas{width:120px;height:140px;position:relative;z-index:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));transition:transform .15s}
#teamScreen .mate::before{content:"";position:absolute;left:50%;top:132px;width:96px;height:16px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(0,0,0,.45),transparent 70%)}
#teamScreen .mate.on::before{background:radial-gradient(rgba(255,215,122,.95),rgba(242,182,50,.35) 55%,transparent 72%);width:120px;height:22px;top:128px}
#teamScreen .mate canvas{transform-origin:50% 100%;transition:transform .22s cubic-bezier(.34,1.56,.64,1),filter .22s}
#teamScreen .mate.on canvas{transform:scale(1.08)}
#teamScreen .mate:hover canvas,#teamScreen .mate:focus-within canvas{transform:scale(1.18);filter:drop-shadow(0 6px 8px rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(255,215,122,.45))}
#teamScreen .mate::before{transition:width .22s,opacity .22s}
#teamScreen .mate:hover::before{width:112px}
#teamScreen .mate b{transition:color .15s}
#teamScreen .mate:hover b{color:var(--gold2)}
@media (prefers-reduced-motion:reduce){#teamScreen .mate canvas{transition:none}}
#teamScreen .mate b{font-size:1.25rem;color:var(--cream);text-shadow:2px 2px 0 #2a1405,-2px 2px 0 #2a1405,2px -1px 0 #2a1405,-2px -1px 0 #2a1405,0 3px 8px rgba(0,0,0,.6)}
#teamScreen .mate .pw b{font-family:var(--display);font-weight:400;font-size:.9rem;color:var(--gold2)}
#teamScreen .mate .d{display:none}
/* upright phones and narrow windows: runners in one scrolling row on the path, Run button always visible */
@media (max-width:760px) and (orientation:portrait){
  #teamScreen{padding:max(14px,env(safe-area-inset-top,0px)) 0 max(12px,env(safe-area-inset-bottom,0px))}
  .stage-top{padding:0 14px}
  .stage-top h1{font-size:1.7rem}
  #teamScreen .team{display:flex;margin-top:auto;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;padding:14px 18px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #teamScreen .team::-webkit-scrollbar{display:none}
  #teamScreen .mate{flex:0 0 42%;scroll-snap-align:center}
  #teamScreen .mate canvas{width:132px;height:154px}
  #teamScreen .mate::before{top:146px;width:110px}
  #teamScreen .mate.on::before{top:142px;width:130px}
  .go{padding:6px 16px 0}
  #goBtn{width:100%;max-width:340px}
}
}
.ftree-wrap{flex:1;overflow:auto;display:flex;padding:4px 4px 12px;-webkit-overflow-scrolling:touch}
.ftree{margin:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,3vh,26px);width:100%}
.gen{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px clamp(14px,3vw,34px)}
.kin{display:flex;align-items:flex-end;gap:2px}
.gen figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.gen-old img{height:clamp(84px,19vh,150px);width:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.ft-name{font:400 1rem var(--display);color:var(--cream);white-space:nowrap;text-shadow:2px 2px 0 #2a1405,-2px 2px 0 #2a1405,2px -1px 0 #2a1405,-2px -1px 0 #2a1405}
.gen-old .ft-name{font-size:1.15rem;color:var(--gold2)}
.gen-mid{max-width:860px}.gen-mid .ft-name{font-size:1.1rem}
.ft-kid{display:flex;flex-direction:column;align-items:center;background:none;box-shadow:none;padding:0 2px;font:inherit;color:inherit;min-height:0;border-radius:10px}
.ft-kid canvas{width:72px;height:84px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
button.ft-kid{cursor:pointer}button.ft-kid:hover canvas,button.ft-kid:focus-visible canvas{transform:scale(1.14)}button.ft-kid:active{transform:none;box-shadow:none}
.gen-old .kin{gap:clamp(14px,4vw,40px)}.gen-kids{gap:6px clamp(20px,4vw,48px)}
@media (min-width:1000px) and (min-height:620px){.gen-old img{height:190px}.ft-kid canvas{width:104px;height:122px}.ft-kid .ft-name{font-size:1.15rem}.gen-mid .ft-name{font-size:1.35rem}.gen-old .ft-name{font-size:1.4rem}.ftree{gap:30px}}
@media (max-width:760px){.ft-kid canvas{width:54px;height:64px}.ft-kid .ft-name,.gen-mid .ft-name{font-size:.9rem}}
@media (max-height:500px) and (orientation:landscape){.gen-old img{height:68px}.ft-kid canvas{width:50px;height:60px}.ftree{gap:8px}}
/* End screen: no panel, celebration over the scene */
#endScreen{background:linear-gradient(rgba(20,8,4,.7),rgba(20,8,4,.35) 40%,rgba(20,8,4,.55) 70%,rgba(20,8,4,.82));align-items:stretch;overflow:hidden}
.end-stage{justify-content:center;align-items:center;text-align:center;gap:clamp(8px,2.2vh,18px);max-width:760px;position:relative;z-index:1}
.end-head{display:flex;flex-direction:column;align-items:center;gap:2px}
.end-head .geez{font-size:clamp(1rem,2.6vw,1.35rem);color:var(--gold);text-shadow:0 2px 0 #2a1405}
.end-head h1{font-size:clamp(2.3rem,8vw,4.2rem);color:var(--gold2);line-height:1;
  text-shadow:0 4px 0 #6b3a12,3px 3px 0 #2a1405,-3px 3px 0 #2a1405,3px -2px 0 #2a1405,-3px -2px 0 #2a1405,0 10px 26px rgba(0,0,0,.55)}
#endScreen:not([hidden]) .end-head h1{animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}
.end-say{display:flex;align-items:flex-end;gap:4px;width:100%;max-width:640px}
.end-say img{height:clamp(70px,16vh,120px);width:auto;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.end-say p{position:relative;margin:0 0 10px 10px;background:var(--cream);color:#3a1d08;border-radius:16px;padding:10px 14px;text-align:left;font-size:clamp(.88rem,2.1vw,1rem);line-height:1.35;box-shadow:0 4px 0 rgba(42,20,5,.45)}
.end-say p::before{content:"";position:absolute;left:-9px;bottom:14px;border:9px solid transparent;border-right-color:var(--cream);border-left:0}
.end-say b{color:#7a4a0c}
.end-letters{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.end-lv{margin:0;font:400 .95rem var(--display);letter-spacing:.06em;color:var(--gold);text-shadow:0 2px 0 #2a1405}
#endScreen .fidel{display:grid;grid-template-columns:repeat(7,minmax(0,62px));gap:6px;justify-content:center;width:100%}
#endScreen .fidel span{font-size:clamp(1.3rem,4vw,1.8rem);padding:8px 0 5px;border-radius:12px;background:rgba(30,15,8,.7);color:rgba(251,243,226,.35);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.15)}
#endScreen .fidel span.got{background:linear-gradient(#ffe39a,#f2b632);color:#3a1d06;box-shadow:0 3px 0 #9c6a14}
#endScreen:not([hidden]) .fidel span{animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
.end-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(30,15,8,.72);border-radius:999px;padding:5px 14px 5px 10px;box-shadow:inset 0 0 0 1.5px rgba(242,182,50,.45)}
.chip b{font:400 1.15rem var(--display);color:var(--cream);font-variant-numeric:tabular-nums}
.chip b.star,.chip b.geez{color:var(--gold);font-size:1.05rem}
.chip img{height:18px;width:auto}
.chip small{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.end-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.end-btns button{min-width:0}
#nextBtn,.end-btns button:not(.ghost){font-size:1.25rem;padding:12px 26px}
.end-btns .ghost{background:rgba(30,15,8,.72)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:0}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}#endScreen .fidel span,#endScreen .end-head h1{animation:none!important}}
@media (max-width:560px){
  .end-btns{display:grid;grid-template-columns:1fr 1fr}.end-btns button:not(.ghost){grid-column:1/-1}
  .end-btns button[hidden]{display:none}.end-say p::before{bottom:12px}
  .chip small{display:none}.chip{padding:4px 12px 4px 9px}.end-btns .ghost{font-size:.92rem;padding:10px 8px}
}
@media (max-height:500px) and (orientation:landscape){
  .end-stage{gap:6px;max-width:900px;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"head head" "say letters" "say stats" "btns btns";align-items:center;column-gap:16px}
  .end-head{grid-area:head;flex-direction:row;gap:12px;justify-content:center;align-items:baseline}.end-head h1{font-size:clamp(1.8rem,8vh,2.4rem)}
  .end-say{grid-area:say;align-self:center}.end-say img{height:clamp(60px,24vh,96px)}.end-say p{font-size:.82rem;padding:8px 11px}
  .end-letters{grid-area:letters}.end-stats{grid-area:stats}.end-btns{grid-area:btns}
  #endScreen .fidel{grid-template-columns:repeat(7,minmax(0,44px));gap:4px}#endScreen .fidel span{font-size:1.15rem;padding:5px 0 3px}#endScreen .fidel small{font-size:.6rem;margin-top:2px}
  .chip{padding:3px 10px 3px 8px}.chip b{font-size:.95rem}.chip small{display:none}
  #nextBtn,.end-btns button:not(.ghost){font-size:1.05rem;padding:9px 18px}.end-btns .ghost{font-size:.9rem;padding:9px 14px}
}

      <div class="menu">

  <div class="overlay" id="teamScreen" hidden>

<script>
(()=>{
const META=__META__;
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

// ---------- the cousins ----------
const KIDS={
  afomia:{name:'Afomia',age:8,h:118,girl:true,shirt:'#fff7e0',parents:'Birhanu & Gete'},
  emmu:{name:'Emmu',age:10,h:128,girl:true,shirt:'#1f6b33',parents:'Uncle Mekbib'},
  eldana:{name:'Eldana',age:10,h:132,girl:true,shirt:'#1f6b33',parents:'Birhanu & Gete'},
  bethani:{name:'Bethani',age:13,h:140,girl:true,shirt:'#b3261e',parents:'Uncle Mekbib'},
  kalkidan:{name:'Kalkidan',age:14,h:150,girl:true,shirt:'#6a2c91',parents:'Birhanu & Gete'},
  kiru:{name:'Kiru',age:17,h:162,girl:false,shirt:'#4a2408',parents:'Uncle Gizaw'},
  nahome:{name:'Nahome',age:25,h:206,girl:false,shirt:'#fff7e0',parents:'Uncle Gizaw'},
  meba:{name:'Meba',age:2,girl:true,parents:'Birhanu & Gete'},
};
const CHARS={
  afomia:{sprite:'afomia',label:'Afomia',power:'magnet',powerName:'Bean magnet',desc:'Beans and letters fly to her.'},
  emmu:{sprite:'emmu',label:'Emmu',power:'double',powerName:'Double beans',desc:'Every bean counts twice.'},
  eldana:{sprite:'eldana',label:'Eldana',power:'letters',powerName:'Letter finder',desc:'Fidel letters show up twice as often.'},
  bethani:{sprite:'bethani',label:'Bethani',power:'jump',powerName:'Triple jump',desc:'Can jump three times in the air.'},
  kalkidan:{sprite:'kalkidan',label:'Kalkidan',power:'shield',powerName:'Princess shield',desc:'A sparkle shield saves her from one crash, and it comes back.'},
  kiru:{sprite:'kiru',label:'Kiru',power:'speed',powerName:'Speed runner',desc:'The fastest legs in the family.'},
  nahome:{sprite:'nahome',label:'Nahome & Meba',power:'smash',powerName:'Strong carrier',desc:'Carries Meba and smashes through 3 obstacles.'},
};
const ORDER=['afomia','emmu','eldana','bethani','kalkidan','kiru','nahome'];
let pick=(()=>{const p=store.get('pick');return CHARS[p]?p:'kalkidan'})();
// Fidel levels: each level is one letter family (ch, shown sound, spoken fallback)
const LEVELS=[
  {key:'ሀ',name:'ሀ family',forms:[['ሀ','hä','ha'],['ሁ','hu','hoo'],['ሂ','hi','hee'],['ሃ','ha','haa'],['ሄ','he','hay'],['ህ','hə','hih'],['ሆ','ho','hoe']]},
  {key:'ለ',name:'ለ family',mode:'field',fld:{w:2600,h:1700,jeb:8,rock:12,tree:20,wind:2,windSpeed:85,npc:2,npcSpeed:150},forms:[['ለ','lä','la'],['ሉ','lu','loo'],['ሊ','li','lee'],['ላ','la','laa'],['ሌ','le','lay'],['ል','lə','lih'],['ሎ','lo','low']]},
  {key:'ሐ',name:'ሐ family',mode:'field',fld:{w:3000,h:2000,jeb:12,rock:16,tree:26,wind:4,windSpeed:105,npc:4,npcSpeed:172},forms:[['ሐ','ḥä','ha'],['ሑ','ḥu','hoo'],['ሒ','ḥi','hee'],['ሓ','ḥa','haa'],['ሔ','ḥe','hay'],['ሕ','ḥə','hih'],['ሖ','ḥo','hoe']]},
];
let lv=(()=>{const v=+store.get('level');return v>=0&&v<LEVELS.length?v:0})();let FIDEL=LEVELS[lv].forms;
const RELATIVES=[['Uncle Desu','ጎበዝ! Keep going!'],['Uncle Sem','Faster, faster!'],['Aunt Lemi & Wonde','You can do it!'],['Aunt Adi & Ermi','Emaye is waiting!'],['Uncle Mekbib','ጎበዝ! Great running!'],['Uncle Gizaw','Almost there!']];
const POWS={speed:{img:'pw_speed',who:'Emaye Tirunesh',line:'Warm milk! Speed burst',t:4},magnet:{img:'pw_magnet',who:'Uncle Sem',line:'Bean magnet!',t:8},
  double:{img:'pw_double',who:'Uncle Desu',line:'Double beans!',t:8},dash:{img:'pw_dash',who:'Gashe Kidane',line:'Super strength!',t:6},
  wings:{img:'mesob',who:'Emaye Tirunesh',line:'ብሉ! Emaye’s injera gives you wings!',t:7,rare:true}};

// ---------- assets ----------
const IMG={};const names=['bg_mountains','bg_hills','bg_ground','tibeb','jebena','mesob','rock','bean','pw_speed','pw_magnet','pw_double','pw_dash','tukul','gashe','emaye','wave_pair','wave_pink','afomia_wave',
  'kalkidan_run','kalkidan_jump','kalkidan_slide','nahome_run','nahome_jump','kiru_run','kiru_jump','bethani_run','bethani_jump','emmu_run','eldana_run','eldana_jump','eldana_slide','afomia_run'];
const loadImg=n=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[n]=i;r()};i.onerror=()=>r();i.src='assets/'+n+'.webp';});
const FACES={};
function loadFaces(){for(const id of Object.keys(KIDS)){const d=store.get('face_'+id);if(d){const i=new Image();i.onload=()=>{FACES[id]=i;drawLineup();};i.src=d;}else delete FACES[id];}}

// Sprite sheets (names are not printed on the shirts)
const SHEET={};
function bake(key,animKey,label,color){const m=META[key][animKey];const src=IMG[key+'_'+animKey];if(!src)return;
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');x.drawImage(src,0,0);
  if(label){let data=null;try{data=x.getImageData(0,0,c.width,c.height).data;}catch(e){}x.globalCompositeOperation='source-atop';
    m.chest.forEach(([cx,cy],i)=>{const ox=i*m.fw;let l=cx,r=cx;const row=Math.round(cy);
      if(data){const A=px=>data[(row*c.width+ox+Math.round(px))*4+3];while(l>2&&A(l-1)>120)l--;while(r<m.fw-2&&A(r+1)>120)r++;}else{l=cx-m.fw*.15;r=cx+m.fw*.15;}
      const tw=Math.max(34,(r-l)*1.55);x.font='40px "Lilita One",sans-serif';const w40=x.measureText(label).width;
      const fs=Math.min(m.fh*.1,40*tw/w40);x.font=fs+'px "Lilita One",sans-serif';x.textAlign='center';x.textBaseline='middle';
      x.save();x.translate(ox+(l+r)/2,cy);x.rotate(-.05);x.fillStyle='rgba(0,0,0,.25)';x.fillText(label,1,1.5);x.fillStyle=color;x.fillText(label,0,0);x.restore();});
    x.globalCompositeOperation='source-over';}
  SHEET[key+'_'+animKey]={c,m};}

// ---------- canvas ----------
const cv=$('c'),ctx=cv.getContext('2d');const H=540,GY=468;let W=960,dpr=1,k=1;
let uiS=1,lastCW=0,lastCH=0;function resize(){const r=cv.getBoundingClientRect();lastCW=r.width;lastCH=r.height;dpr=Math.min(devicePixelRatio||1,2.5);cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));k=r.height/H;W=r.width/k;uiS=Math.min(1.6,Math.max(1,.92/k));}
addEventListener('resize',()=>{resize();drawLineup();});
addEventListener('orientationchange',()=>{setTimeout(()=>{resize();drawLineup();},250);});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{resize();});

function layer(img,y,h,off){if(!img)return;const s=h/img.height,w=img.width*s;let x=-((off%w)+w)%w;for(;x<W;x+=w)ctx.drawImage(img,x,y,w+1,h);}
function drawBg(scroll){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5a3a72');g.addColorStop(.5,'#d98a6a');g.addColorStop(1,'#7a4a2a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  layer(IMG.bg_mountains,0,385,scroll*.12);layer(IMG.bg_hills,166,270,scroll*.38);layer(IMG.bg_ground,372,168,scroll);
  if(IMG.tibeb){const th=20,s=th/IMG.tibeb.height,w=IMG.tibeb.width*s;let x=-((scroll%w)+w)%w;for(;x<W;x+=w)ctx.drawImage(IMG.tibeb,x,H-th,w+1,th);}}

// draw a cousin (feet at x,y). Returns nothing.
function figH(key){return (META[key].run.foot-6)}
function drawKid(key,anim,frame,x,y,dispH,opt={}){const sh=SHEET[key+'_'+anim]||SHEET[key+'_run'];if(!sh)return;const m=sh.m;const s=dispH*(opt.scale||1)/figH(key);
  const f=(anim==='run'&&m.n===3)?[0,1,2,1][((frame%4)+4)%4]:((frame%m.n)+m.n)%m.n;const w=m.fw*s,h=m.fh*s;const dx=x-w*.5,dy=y-m.foot*s;
  ctx.save();if(opt.alpha!=null)ctx.globalAlpha=opt.alpha;if(opt.rot||opt.flip){ctx.translate(x,y);if(opt.rot)ctx.rotate(opt.rot);if(opt.flip)ctx.scale(-1,1);ctx.translate(-x,-y);}
  ctx.drawImage(sh.c,f*m.fw,0,m.fw,m.fh,dx,dy,w,h);
  const faceIds=key==='nahome'?['nahome','meba']:[key];const fl=m.face&&m.face[f];
  if(fl)fl.forEach(([fx,fy,fr],j)=>{const im=FACES[faceIds[j]];if(!im)return;const cx=dx+fx*s,cy=dy+fy*s,r=fr*s*1.28;
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();ctx.drawImage(im,cx-r,cy-r,r*2,r*2);ctx.restore();
    ctx.strokeStyle='rgba(60,30,10,.55)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();});
  ctx.restore();}
function drawRunner(spr,anim,frame,x,y,opt={}){
  if(spr==='afomia'||spr==='emmu'){if(anim==='jump'){anim='run';opt={...opt,rot:(opt.rot||0)-.12};}}
  drawKid(spr,anim,frame,x,y,KIDS[spr].h,opt);}
const sprH=spr=>KIDS[spr].h;
const sprW=spr=>spr==='nahome'?52:40;

// ---------- audio: chimes + spoken letters ----------
// ---------- audio: buses, music, effects (all generated, no files) ----------
let AC=null,BUS=null,NOISE=null;const SND={music:store.get('music')!=='0',sfx:store.get('sfx')!=='0'};
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);
    BUS={out:comp,music:AC.createGain(),sfx:AC.createGain()};BUS.music.gain.value=SND.music?.34:0;BUS.sfx.gain.value=SND.sfx?.9:0;BUS.music.connect(comp);BUS.sfx.connect(comp);
    NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}
  if(AC&&AC.state==='suspended'&&!document.hidden)AC.resume();return AC;}
const now0=()=>AC.currentTime;
function tone(f,d=.12,type='sine',v=.15,when=0,bus,f2){const a=ac();if(!a)return;const t0=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(bus||BUS.sfx);o.start(t0);o.stop(t0+d+.03);}
function noise(d,v,type='bandpass',fq=1200,when=0,bus,q=1,fq2){const a=ac();if(!a)return;const t0=a.currentTime+when,src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=NOISE;
  f.type=type;f.frequency.setValueAtTime(fq,t0);if(fq2)f.frequency.exponentialRampToValueAtTime(fq2,t0+d);f.Q.value=q;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  src.connect(f).connect(g).connect(bus||BUS.sfx);src.start(t0,Math.random()*.5);src.stop(t0+d+.02);}
// krar-like pluck: bright attack, quick decay
function pluck(f,when,v=.12,dur=.55,bus){const a=ac();if(!a)return;const t0=when,g=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(3200,t0);lp.frequency.exponentialRampToValueAtTime(900,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.004);g.gain.exponentialRampToValueAtTime(.001,t0+dur);lp.connect(g).connect(bus||BUS.music);
  for(const [tp,m,vv] of [['triangle',1,1],['sawtooth',1.004,.35],['sine',2,.25]]){const o=a.createOscillator(),og=a.createGain();o.type=tp;o.frequency.value=f*m;og.gain.value=vv;o.connect(og).connect(lp);o.start(t0);o.stop(t0+dur+.05);}}
function drum(when,low,v,bus){const a=ac();if(!a)return;const t0=when,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(low?120:260,t0);o.frequency.exponentialRampToValueAtTime(low?48:140,t0+(low?.22:.08));
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+(low?.32:.12));o.connect(g).connect(bus||BUS.music);o.start(t0);o.stop(t0+.4);
  const src=a.createBufferSource(),f=a.createBiquadFilter(),ng=a.createGain();src.buffer=NOISE;f.type=low?'lowpass':'bandpass';f.frequency.value=low?600:2400;f.Q.value=low?.7:1.4;
  ng.gain.setValueAtTime(v*(low?.5:.7),t0);ng.gain.exponentialRampToValueAtTime(.001,t0+(low?.08:.05));src.connect(f).connect(ng).connect(bus||BUS.music);src.start(t0,Math.random()*.5);src.stop(t0+.12);}
